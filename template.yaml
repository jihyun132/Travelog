AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: travelog backend (FastAPI + Mangum, Lambdalith)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon Postgres pooler connection string (postgresql+psycopg://...)
  JwtSecretKey:
    Type: String
    NoEcho: true
  KakaoClientId:
    Type: String
    Default: ""
    NoEcho: true
  KakaoRedirectUri:
    Type: String
    Default: ""

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12

Resources:
  TravelogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET_KEY: !Ref JwtSecretKey
          S3_BUCKET_NAME: !Ref PhotoBucket
          KAKAO_CLIENT_ID: !Ref KakaoClientId
          KAKAO_REDIRECT_URI: !Ref KakaoRedirectUri
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotoBucket
      Events:
        ProxyRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyAny:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
