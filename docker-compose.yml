services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelog
      POSTGRES_PASSWORD: travelog
      POSTGRES_DB: travelog
    ports:
      - "5432:5432"
    volumes:
      - travelog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  travelog_pgdata:
